name: Flutter テスト自動実行

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4

    - name: Java 11をセットアップ
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Flutter SDKをセットアップ
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'
        cache: true

    - name: Flutter doctorを実行
      run: flutter doctor -v

    - name: 依存関係をインストール
      run: flutter pub get

    - name: モックファイルを生成
      run: dart run build_runner build --delete-conflicting-outputs
      continue-on-error: true

    - name: コード解析を実行
      run: flutter analyze

    - name: 単体テストを実行
      run: flutter test test/unit/ --reporter expanded

    - name: ウィジェットテストを実行
      run: flutter test test/widget/ --reporter expanded

    - name: 全テスト（カバレッジ付き）を実行
      run: flutter test --coverage --reporter expanded

    - name: lcovをインストール
      run: sudo apt-get install -y lcov

    - name: カバレッジレポートを生成
      run: genhtml coverage/lcov.info -o coverage/html

    - name: カバレッジをアップロード
      uses: codecov/codecov-action@v3
      with:
        file: coverage/lcov.info
        flags: flutter
        name: flutter-tests
        fail_ci_if_error: false

    - name: テストレポートをアーティファクトとして保存
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: coverage-report
        path: coverage/html/

    - name: テスト結果をコメント
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Flutter テスト結果
        path: 'test-results.xml'
        reporter: java-junit
        fail-on-error: false

  build-android:
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4

    - name: Java 11をセットアップ
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Flutter SDKをセットアップ
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'
        cache: true

    - name: 依存関係をインストール
      run: flutter pub get

    - name: Android APKをビルド
      run: flutter build apk --debug

    - name: APKをアーティファクトとして保存
      uses: actions/upload-artifact@v3
      with:
        name: debug-apk
        path: build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    runs-on: macos-latest
    needs: test
    if: success()

    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4

    - name: Flutter SDKをセットアップ
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'
        cache: true

    - name: 依存関係をインストール
      run: flutter pub get

    - name: iOS Podをセットアップ
      run: cd ios && pod install

    - name: iOS アプリをビルド（シミュレーター用）
      run: flutter build ios --debug --simulator

    - name: iOS ビルド結果を確認
      run: ls -la build/ios/iphonesimulator/

  security-scan:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: リポジトリをチェックアウト
      uses: actions/checkout@v4

    - name: Flutter SDKをセットアップ
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.x'
        channel: 'stable'

    - name: 依存関係をインストール
      run: flutter pub get

    - name: セキュリティ監査を実行
      run: flutter pub audit
      continue-on-error: true

    - name: 依存関係の脆弱性チェック
      uses: securecodewarrior/github-action-add-sarif@v1
      if: always()
      with:
        sarif-file: 'security-scan-results.sarif'
      continue-on-error: true